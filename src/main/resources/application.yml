spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/filetransfer
    username: postgres
    password: Shivam@26
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
          fetch_size: 100

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 11MB

  # FIX 1: websocket must be under spring.websocket, not spring.servlet.websocket
  websocket:
    message-size-limit: 65536
    send-buffer-size-limit: 524288

app:
  storage:
    base-path: C:/filetransfer
    chunk-dir: chunks
    file-dir: files
  upload:
    chunk-size-bytes: 5242880
    max-file-size-bytes: 10737418240
    chunk-ttl-hours: 24
  share:
    default-expiry-hours: 72
    code-length: 8
  async:
    merge-pool-size: 4
    chunk-pool-size: 8

  # FIX 2: p2p must be under app.p2p, not at root level
  p2p:
    enabled: true
    peer-join-timeout-seconds: 30
    ice-servers:
      - urls: stun:stun.l.google.com:19302
      - urls: stun:stun1.l.google.com:19302

logging:
  level:
    com.filetransfer: DEBUG
    org.springframework.web: INFO